name: Run demo.py

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run demo.py
        run: python demo.py
